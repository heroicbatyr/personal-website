services:
  personal-site:
    build: .
    container_name: personal-site
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      FINANCE_API_URL: http://finance-service:8080
    expose:
      - "3000"
    networks:
      - website-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  finance-service:
    build:
      context: ./finance-service
    container_name: stock-research-api
    restart: unless-stopped
    env_file:
      - path: .env.finance
        required: false
    expose:
      - "8080"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - finance-cache:/app/data
    networks:
      - website-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: batyrbek-tunnel
    restart: unless-stopped
    env_file:
      - .env.cloudflared
    command: tunnel --loglevel info run
    depends_on:
      personal-site:
        condition: service_healthy
    networks:
      - website-internal

networks:
  website-internal:
    name: website-internal

volumes:
  finance-cache:
    name: personal-website-finance-cache
